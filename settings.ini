[General]
; Time in milliseconds to consider a key press as a "hold"
HoldTimeout=150
; Double tap timeout (not currently used but good to have)
DoubleTapTimeout=200
; Mouse movement speed (Base speed)
MouseSpeed=10
; Mouse acceleration factor (higher = faster acceleration)
MouseAcceleration=1.1
; Maximum mouse speed
MaxMouseSpeed=50
; Mouse movement loop interval in ms (lower = smoother but more CPU)
MouseInterval=20

[Keys]
; CapsLock Layer keys (CapsLock + Key)
; --- Navigation ---
p=MoveUp
n=MoveDown
b=MoveLeft
f=MoveRight
a=MoveHome
e=MoveEnd
; --- Editing ---
d=Delete
c=ClipboardHistory
; --- Word-level Movement (#7) ---
w=WordRight
q=WordLeft
; --- Page Navigation (#8) ---
v=PageDown
; --- Mouse Control ---
i=MouseUp
k=MouseDown
j=MouseLeft
l=MouseRight
u=MouseClickLeft
o=MouseClickRight
/=ClipboardHistory
^.=ClipboardHistory

[GlobalKeys]
; Global Shortcuts (Alt -> Ctrl mappings usually)
!n=^n
!o=^o
!p=^p
!r=^r
!h=WinMinimize
!m=WinMinimize
!c=^c
!x=^x
!v=^v
!a=^a
!z=^z
!y=^y
!f=^f
!s=^s
!b=^b
!i=^i
!u=^u
!/=^/
!w=^w
!t=^t
!q=!{F4}
!Left={Home}
!Right={End}
!Up=^{Home}
!Down=^{End}
!BackSpace=+{Home}{Delete}

[ExcludedApps]
; Comma-separated list of process names to exclude
ProcessNames=
